# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name glowfiesta2026.e-connectsolutions.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name glowfiesta2026.e-connectsolutions.com;

    # SSL Certificate and Private Key
    ssl_certificate /etc/nginx/certs/e-connectsolutions.crt;
    ssl_certificate_key /etc/nginx/certs/e-connectsolutions.key;

    # SSL Protocols & Ciphers (Modern Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size (for team selfie uploads)
    client_max_body_size 30M;

    # Proxy to Next.js App container
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
