version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glowfiesta-app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://thunt:Thunt%24%241234%24%2456789%24%242026@192.168.100.33:3306/thunt}
      SESSION_PASSWORD: ${SESSION_PASSWORD:-glowfiesta-super-secret-session-key-min-32-chars!}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://glowfiesta2026.e-connectsolutions.com}
      PORT: 3000
    networks:
      - glowfiesta-net
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: glowfiesta-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - glowfiesta-net

networks:
  glowfiesta-net:
    driver: bridge

